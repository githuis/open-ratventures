[package]
name = "rat-client"
edition = "2024"
version = "0.1.0"

[dependencies]
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30.0"
ratback-types = { path = "../ratback-types" }
reqwest = { version = "0.13.2", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1", features = ["rt", "macros", "time"] }
