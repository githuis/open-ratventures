[package]
name = "rat-client"
edition = "2024"
version = "0.1.0"

[dependencies]
color-eyre = "0.6.5"
ratback-types = { path = "../ratback-types" }
reqwest = { version = "0.13.2", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0.149"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3"
# ratatui with default features (includes crossterm backend)
ratatui = "0.30.0"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# ratatui without crossterm — widgets and layout only
ratatui = { version = "0.30.0", default-features = false, features = ["all-widgets", "layout-cache"] }
ratzilla = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
