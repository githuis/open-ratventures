[package]
name = "ratback"
version = "0.1.2"
edition = "2024"

[[bin]]
name = "ratback-bin"
path = "src/main.rs"

[lib]
name = "ratback"
path = "src/lib.rs"

[dependencies]
axum = "0.8.8"
color-eyre = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
rand = "0.8"
ratback-types = { path = "../ratback-types", features = ["sqlx"] }
